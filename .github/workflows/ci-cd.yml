# CI/CD тестовой среды BugBoard.
# 1) unit        - модульные тесты кода приложения
# 2) integration - сборка всех контейнеров и автотесты в контейнере tests
# 3) delivery    - публикация образов в GitHub Container Registry
# 4) deploy      - развёртывание стека в Docker Swarm и smoke-тест

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  POSTGRES_DB: bugboard
  POSTGRES_USER: testenv
  POSTGRES_PASSWORD: testenv_pass
  APP_ENV: ci

jobs:
  unit:
    name: Модульные тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка зависимостей
        run: pip install -r app/requirements.txt
      - name: pytest
        run: pytest -v app/tests

  integration:
    name: Интеграционные тесты в Docker
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Создание .env
        run: cp .env.example .env
      - name: Сборка и запуск тестовой среды
        run: docker compose up -d --build --wait
      - name: Список контейнеров
        run: docker compose ps
      - name: Автотесты
        run: docker compose --profile test run --rm tests
      - name: Логи при ошибке
        if: failure()
        run: docker compose logs
      - name: Отчёт о тестах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: test-reports/
      - name: Остановка среды
        if: always()
        run: docker compose --profile test down -v

  delivery:
    name: Публикация образов в GHCR
    runs-on: ubuntu-latest
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [app, nginx, db, tests]
    steps:
      - uses: actions/checkout@v4
      - name: Имя реестра в нижнем регистре
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/testenv" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Сборка и публикация ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}

  deploy:
    name: Деплой в Docker Swarm
    runs-on: ubuntu-latest
    needs: delivery
    timeout-minutes: 15
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Переменные
        run: |
          echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/testenv" >> $GITHUB_ENV
          echo "TAG=${{ github.sha }}" >> $GITHUB_ENV
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Инициализация кластера
        run: docker swarm init
      - name: Развёртывание стека
        run: docker stack deploy -c docker-stack.yml --with-registry-auth --detach=true testenv
      - name: Ожидание запуска
        run: |
          for i in $(seq 1 30); do
            if curl -sf --max-time 5 http://localhost:8080/health; then echo; echo "среда запущена"; exit 0; fi
            sleep 5
          done
          docker stack ps testenv --no-trunc
          exit 1
      - name: Состояние сервисов
        run: docker stack services testenv
      - name: Логи сервисов при ошибке
        if: failure()
        run: |
          docker stack ps testenv --no-trunc
          for s in app nginx db; do docker service logs --tail 30 testenv_$s; done
      - name: Smoke-тест на развёрнутой среде
        run: |
          docker run --rm --network testenv_frontend \
            -e BASE_URL=http://nginx -e MAILPIT_URL=http://mailpit:8025 \
            $REGISTRY/tests:$TAG pytest -v
