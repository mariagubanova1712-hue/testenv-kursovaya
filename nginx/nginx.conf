# Контейнер nginx - единая точка входа в тестовую среду.
# Принимает запросы на порту 80 и передаёт их приложению.

upstream bugboard {
    # имя сервиса app превращается в IP через встроенный DNS Docker
    server app:5000;
}

server {
    listen 80;
    server_name localhost;
    charset utf-8;

    access_log /var/log/nginx/access.log;

    location / {
        proxy_pass http://bugboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # в ответе видно, какой экземпляр приложения обработал запрос
        add_header X-Upstream $upstream_addr always;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /nginx-health {
        access_log off;
        return 200 "nginx ok\n";
    }
}
